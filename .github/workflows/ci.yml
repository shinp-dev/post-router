name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.401
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Restore locked dependencies
        run: dotnet restore PostRouter.sln --locked-mode -m:1
      - name: Build
        run: dotnet build PostRouter.sln -c Release --no-restore -m:1
      - name: Verify formatting
        if: runner.os == 'Linux'
        run: dotnet format whitespace src --folder --verify-no-changes && dotnet format whitespace tests --folder --verify-no-changes
      - name: Test
        run: dotnet test PostRouter.sln -c Release --no-build --no-restore -m:1 --logger "trx;LogFileName=tests.trx"
      - name: Test GUI connection status
        run: node --test tests/gui-media-check.test.cjs
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: "**/TestResults/*.trx"
          if-no-files-found: ignore
